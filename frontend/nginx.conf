server {
    listen 80;
    server_name localhost;

    # ── Static files (Vite build output) ─────────────────
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 256;

    # ── 关于 Host 头：为什么用 $http_host 而不是 $host ────
    # $host 是「规范化后的主机名」，会丢掉端口；$http_host 是浏览器发来的原值。
    # 后端用 Host 头判断「这个请求是不是同源」（Spring 的 CorsUtils 比对
    # scheme + host + port），端口一丢，非 80 端口部署时同源 POST 会被误判成
    # 跨域，前端表现是「列表能打开、一登录就 403 Invalid CORS request」。
    # 用 $http_host 保留端口，80 端口下两者等价，不影响现有部署。

    # ── SSE：Agent 流式对话 ─────────────────────────────
    # 必须单独配置：Nginx 默认开启 proxy_buffering，会把 SSE 攒在缓冲区里，
    # 浏览器要等到响应结束才一次性收到，表现为「聊天气泡长时间空白、卡片不出现」。
    # 这个 location 比 /api 更具体，Nginx 会优先匹配。
    location = /api/agent/chat {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;          # 逐帧转发，不攒包
        proxy_cache off;
        gzip off;                     # 压缩也会引入缓冲
        chunked_transfer_encoding on;
        proxy_read_timeout 300s;      # 长回答 + 工具轮
        proxy_send_timeout 300s;
        client_max_body_size 6M;
    }

    # ── API reverse proxy → Spring Boot backend ─────────
    location /api {
        proxy_pass http://backend:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for long-running predictions
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;

        # Multipart file upload support (5 MB file + multipart overhead)
        client_max_body_size 6M;
    }

    # ── Swagger docs pass-through ───────────────────────
    location /docs {
        proxy_pass http://backend:8080;
        proxy_set_header Host $http_host;
    }
    location /v3 {
        proxy_pass http://backend:8080;
        proxy_set_header Host $http_host;
    }

    # ── SPA fallback — all other routes → index.html ────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets aggressively
    location /assets {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
